name: publish

# 只在打 tag 时发布：v0.1.0 → npm 上的 0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write   # OIDC 可信发布必需：没有它 GitHub 不会签发身份令牌

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 注意：这里**故意不写 registry-url**。
      # setup-node 的 registry-url 会生成带占位 _authToken 的 .npmrc，
      # 那个占位值会盖过 OIDC 交换，导致 ENEEDAUTH / 404。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # node 22 的 runner 镜像自带 npm 10.x，没有 OIDC 代码路径，必须先升
      - name: 升级 npm（OIDC 需要 >= 11.15）
        run: npm install -g npm@^11.15.0 && npm --version

      - name: 单测（523 条，不依赖宿主包）
        run: node --experimental-strip-types --test extensions/skill-evolve/test/*.test.ts

      - name: 版本一致性（tag 必须等于 package.json version）
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          [ "$tag" = "$pkg" ] || { echo "tag $tag != package.json $pkg"; exit 1; }

      # 不传 NODE_AUTH_TOKEN：npm CLI 会用 GitHub 的 OIDC 令牌换短期凭据，
      # provenance 由 npm 自动生成（可信发布 + 公开仓库）。
      - name: 发布到 npm
        run: npm publish --access public
